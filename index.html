<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Doll</title>

<style>

* {
box-sizing: border-box;
}

html,
body {

width: 100%;
height: 100%;

margin: 0;
padding: 0;

overflow: hidden;

background: #000;

font-family: Arial, sans-serif;
}

body {
touch-action: none;
}

/*
* Three.js canvas
*/

canvas {

position: fixed;

left: 0;
top: 0;

width: 100%;
height: 100%;

display: block;

z-index: 1;
}

/*
* Instruction
*/

#instruction {

position: fixed;

left: 50%;

bottom: 70px;

transform: translateX(-50%);

display: none;

width: max-content;

max-width: calc(100% - 40px);

padding: 14px 25px;

border-radius: 30px;

background: rgba(0, 0, 0, 0.72);

color: white;

font-size: 17px;

font-weight: bold;

text-align: center;

z-index: 10;

pointer-events: none;

backdrop-filter: blur(8px);

-webkit-backdrop-filter: blur(8px);
}

/*
* Loading
*/

#loading {

position: fixed;

inset: 0;

display: flex;

justify-content: center;

align-items: center;

background: #000;

color: white;

font-size: 17px;

z-index: 20;
}

/*
* Error
*/

#error {

position: fixed;

left: 20px;
right: 20px;

top: 50%;

transform: translateY(-50%);

display: none;

padding: 22px;

border-radius: 15px;

background: white;

color: #111;

text-align: center;

font-size: 16px;

z-index: 30;
}

</style>

</head>

<body>

<!-- Loading -->

<div id="loading">

در حال بارگذاری...

</div>

<!-- Instruction -->

<div id="instruction">

برای ادامه صفحه را لمس کنید

</div>

<!-- Error -->

<div id="error">

اجرای واقعیت افزوده در این دستگاه امکان‌پذیر نیست.

</div>

<!--
Three.js
-->

<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}
}
</script>

<script type="module">

import * as THREE from "three";

import { GLTFLoader }
from "three/addons/loaders/GLTFLoader.js";

/*
* ==========================================
* ELEMENTS
* ==========================================
*/

const loading =
document.getElementById("loading");

const instruction =
document.getElementById("instruction");

const errorBox =
document.getElementById("error");

/*
* ==========================================
* THREE.JS
* ==========================================
*/

const scene =
new THREE.Scene();

const camera =
new THREE.PerspectiveCamera(
70,
window.innerWidth /
window.innerHeight,
0.01,
100
);

/*
* WebXR renderer
*/

const renderer =
new THREE.WebGLRenderer({

antialias: true,

alpha: true,

powerPreference: "high-performance"

});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.xr.enabled = true;

renderer.xr.setReferenceSpaceType(
"local-floor"
);

document.body.appendChild(
renderer.domElement
);

/*
* ==========================================
* LIGHTING
* ==========================================
*
* GLB materials need some light.
*/

const ambientLight =
new THREE.HemisphereLight(
0xffffff,
0x444444,
2
);

scene.add(ambientLight);

const directionalLight =
new THREE.DirectionalLight(
0xffffff,
2
);

directionalLight.position.set(
2,
4,
2
);

scene.add(directionalLight);

/*
* ==========================================
* MODEL
* ==========================================
*/

let doll = null;

let mixer = null;

let animationClip = null;

let animationStarted = false;

/*
* IMPORTANT:
*
* The model is NOT added to the scene
* until the user touches the screen.
*/

const loader =
new GLTFLoader();

loader.load(

"./doll.glb",

function (gltf) {

doll =
gltf.scene;

/*
* Model starts completely invisible.
*/

doll.visible = false;

/*
* Keep the original GLB
* materials and textures.
*/

doll.traverse(
function (object) {

if (
object.isMesh
) {

object.frustumCulled =
false;

}

}
);

/*
* Animation
*/

if (
gltf.animations &&
gltf.animations.length > 0
) {

mixer =
new THREE.AnimationMixer(
doll
);

/*
* Use the first animation
* contained in the GLB.
*/

animationClip =
gltf.animations[0];

}

/*
* We do NOT add the model
* to the scene yet.
*
* Therefore the user cannot
* see even its first frame.
*/

loading.style.display =
"none";

/*
* Try to start AR immediately.
*/

startAR();

},

undefined,

function (error) {

console.error(
"GLB loading error:",
error
);

loading.style.display =
"none";

errorBox.style.display =
"block";

}

);

/*
* ==========================================
* START AR
* ==========================================
*/

async function startAR() {

/*
* Check WebXR
*/

if (
!navigator.xr
) {

showError();

return;

}

try {

const supported =
await navigator.xr.isSessionSupported(
"immersive-ar"
);

if (!supported) {

showError();

return;

}

/*
* Request AR session.
*
* The browser/OS controls
* its own permission prompt.
*/

const session =
await navigator.xr.requestSession(
"immersive-ar",
{

requiredFeatures: [
"local-floor"
 ],

optionalFeatures: [
"dom-overlay"
 ],

domOverlay: {
root: document.body
}

}
);

/*
* Start WebXR
*/

await renderer.xr.setSession(
session
);

/*
* AR is now running.
*/

instruction.style.display =
"block";

/*
* Model is STILL hidden.
*/

if (doll) {

doll.visible =
false;

}

/*
* When AR ends
*/

session.addEventListener(
"end",
function () {

instruction.style.display =
"none";

animationStarted =
false;

if (doll) {

doll.visible =
false;

scene.remove(
doll
);

}

}
);

}
catch (error) {

console.error(
"Unable to start WebXR:",
error
);

/*
* This normally happens when
* the browser requires a user
* gesture before requestSession().
*/

showError();

}

}

/*
* ==========================================
* USER TOUCH
* ==========================================
*
* The model becomes visible ONLY
* after the first touch.
*/

window.addEventListener(
"touchstart",
showModelAndStartAnimation,
{
passive: true,
once: true
}
);

window.addEventListener(
"click",
showModelAndStartAnimation,
{
once: true
}
);

function showModelAndStartAnimation() {

/*
* If model hasn't loaded,
* do nothing.
*/

if (!doll) {

return;

}

/*
* If AR isn't running,
* do nothing.
*/

if (
!renderer.xr.isPresenting
) {

return;

}

/*
* Hide instruction.
*/

instruction.style.display =
"none";

/*
* ======================================
* MODEL POSITION
* ======================================
*
* Put the doll approximately
* 1 meter in front of the viewer.
*/

const xrCamera =
renderer.xr.getCamera(
camera
);

const direction =
new THREE.Vector3(
0,
0,
-1
);

direction.applyQuaternion(
xrCamera.quaternion
);

/*
* Put model 1 meter forward.
*/

doll.position.copy(
xrCamera.position
);

doll.position.add(
direction.multiplyScalar(1)
);

/*
* Put model on approximately
* the same vertical level.
*/

doll.position.y =
xrCamera.position.y;

/*
* Make model face the viewer.
*/

const lookPosition =
new THREE.Vector3();

lookPosition.copy(
xrCamera.position
);

lookPosition.y =
doll.position.y;

doll.lookAt(
lookPosition
);

/*
* ======================================
* SHOW MODEL
* ======================================
*/

doll.visible =
true;

scene.add(
doll
);

/*
* ======================================
* START ANIMATION
* ======================================
*/

if (
mixer &&
animationClip &&
!animationStarted
) {

animationStarted =
true;

/*
* Start from frame zero.
*/

mixer.setTime(
0
);

/*
* Play ONLY ONCE.
*/

const action =
mixer.clipAction(
animationClip
);

action.reset();

action.setLoop(
THREE.LoopOnce,
1
);

action.clampWhenFinished =
true;

action.play();

}

}

/*
* ==========================================
* ANIMATION UPDATE
* ==========================================
*/

const clock =
new THREE.Clock();

renderer.setAnimationLoop(
function () {

const delta =
clock.getDelta();

/*
* Update GLB animation.
*/

if (
mixer &&
animationStarted
) {

mixer.update(
delta
);

}

/*
* Render
*/

renderer.render(
scene,
camera
);

}
);

/*
* ==========================================
* RESIZE
* ==========================================
*/

window.addEventListener(
"resize",
function () {

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

/*
* ==========================================
* ERROR
* ==========================================
*/

function showError() {

loading.style.display =
"none";

errorBox.style.display =
"block";

}

</script>

</body>

</html>
