<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR Doll - Final</title>

<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<style>
body { margin: 0; overflow: hidden; }
#status {
position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%);
background: rgba(0,0,0,0.8);
color: #0f0;
padding: 12px 24px;
border-radius: 30px;
font-family: monospace;
z-index: 999;
font-size: 16px;
text-align: center;
backdrop-filter: blur(5px);
border: 1px solid rgba(255,255,255,0.2);
white-space: nowrap;
}
</style>
</head>
<body>

<a-scene
embedded
arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; matrixCodeType: 3x3;"
>

<!-- دوربین با تنظیمات بدون زوم -->
<a-entity camera>

<!-- مدل جلوی دوربین با مقیاس مناسب -->
<a-entity
gltf-model="doll.glb"
animation-mixer="clip: *; loop: repeat; timeScale: 1;"
scale="0.8 0.8 0.8"
position="0 0.2 -2.5"
></a-entity>

</a-entity>

</a-scene>

<div id="status">📱 در حال بارگذاری عروسک...</div>

<script>
const statusEl = document.getElementById('status');

// وقتی مدل لود شد
document.querySelector('a-entity[gltf-model]').addEventListener('model-loaded', function() {
statusEl.innerHTML = '🎉 عروسک آماده است!';
statusEl.style.color = '#0f0';
});

// خطا در لود
document.querySelector('a-entity[gltf-model]').addEventListener('model-error', function() {
statusEl.innerHTML = '❌ خطا: فایل doll.glb پیدا نشد!';
statusEl.style.color = '#f00';
});
</script>
</body>
</html>
