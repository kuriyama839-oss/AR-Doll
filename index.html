<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Doll</title>

<style>

* {
box-sizing: border-box;
}

html,
body {

width: 100%;
height: 100%;

margin: 0;
padding: 0;

overflow: hidden;

background: #000;

font-family: Arial, sans-serif;

touch-action: none;
}

/*
* دوربین معمولی مرورگر
* فقط به عنوان تصویر پس‌زمینه
* تا زمانی که WebXR شروع شود.
*/

#camera {

position: fixed;

inset: 0;

width: 100%;
height: 100%;

object-fit: cover;

transform: scaleX(-1);

background: #000;

display: none;

z-index: 1;
}

/*
* Canvas سه‌بعدی
*/

canvas {

position: fixed;

inset: 0;

width: 100%;
height: 100%;

display: block;

z-index: 2;
}

/*
* راهنما
*/

#instruction {

position: fixed;

left: 50%;
bottom: 70px;

transform: translateX(-50%);

display: none;

width: max-content;

max-width: calc(100% - 40px);

padding: 14px 24px;

border-radius: 30px;

background: rgba(0, 0, 0, 0.72);

color: white;

font-size: 17px;

font-weight: bold;

text-align: center;

z-index: 20;

pointer-events: none;

backdrop-filter: blur(8px);

-webkit-backdrop-filter: blur(8px);
}

/*
* فقط هنگام بارگذاری GLB
*/

#loading {

position: fixed;

inset: 0;

display: flex;

align-items: center;
justify-content: center;

background: #000;

color: white;

font-size: 17px;

z-index: 30;
}

</style>

</head>

<body>

<!-- دوربین -->

<video
id="camera"
autoplay
playsinline
muted
></video>

<!-- راهنما -->

<div id="instruction">

برای ادامه صفحه را لمس کنید

</div>

<!-- بارگذاری -->

<div id="loading">

در حال بارگذاری...

</div>

<!-- Three.js -->

<script type="importmap">

{
"imports": {

"three":
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

"three/addons/":
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

}
}

</script>

<script type="module">

import * as THREE from "three";

import { GLTFLoader }

from
"three/addons/loaders/GLTFLoader.js";

/*
* =========================================
* ELEMENTS
* =========================================
*/

const video =
document.getElementById("camera");

const instruction =
document.getElementById("instruction");

const loading =
document.getElementById("loading");

/*
* =========================================
* THREE.JS
* =========================================
*/

const scene =
new THREE.Scene();

const camera =
new THREE.PerspectiveCamera(

70,

window.innerWidth /
window.innerHeight,

0.01,

100

);

const renderer =
new THREE.WebGLRenderer({

antialias: true,

alpha: true,

powerPreference:
"high-performance"

});

renderer.setPixelRatio(

Math.min(
window.devicePixelRatio,
2
)

);

renderer.setSize(

window.innerWidth,
window.innerHeight

);

renderer.xr.enabled = true;

renderer.xr.setReferenceSpaceType(
"local-floor"
);

renderer.domElement.style.display =
"none";

document.body.appendChild(
renderer.domElement
);

/*
* =========================================
* LIGHTS
* =========================================
*/

const ambientLight =
new THREE.HemisphereLight(

0xffffff,
0x444444,
2

);

scene.add(
ambientLight
);

const directionalLight =
new THREE.DirectionalLight(

0xffffff,
2

);

directionalLight.position.set(

2,
4,
2

);

scene.add(
directionalLight
);

/*
* =========================================
* MODEL VARIABLES
* =========================================
*/

let doll = null;

let mixer = null;

let animationClip = null;

let animationStarted = false;

let arSession = null;

let cameraStream = null;

let arIsRunning = false;

/*
* =========================================
* MODEL SCALE
* =========================================
*
* نصف اندازه‌ی فایل GLB اصلی
*/

const DOLL_SCALE = 0.5;

/*
* =========================================
* LOAD GLB
* =========================================
*/

const loader =
new GLTFLoader();

loader.load(

"./doll.glb",

function (gltf) {

doll =
gltf.scene;

/*
* مدل کاملاً مخفی است.
*/

doll.visible =
false;

/*
* نصف اندازه‌ی اصلی
*/

doll.scale.set(

DOLL_SCALE,
DOLL_SCALE,
DOLL_SCALE

);

/*
* Animation Mixer
*/

if (

gltf.animations &&
gltf.animations.length > 0

) {

mixer =
new THREE.AnimationMixer(
doll
);

/*
* اولین Animation داخل GLB
*/

animationClip =
gltf.animations[0];

}

/*
* مدل هنوز به Scene اضافه نمی‌شود.
*
* بنابراین کاربر حتی یک فریم
* از آن نمی‌بیند.
*/

loading.style.display =
"none";

/*
* حالا درخواست دوربین
* از خود مرورگر
*/

requestCamera();

},

undefined,

function (error) {

console.error(
"GLB error:",
error
);

loading.textContent =
"خطا در بارگذاری فایل doll.glb";

}

);

/*
* =========================================
* REQUEST CAMERA
* =========================================
*
* پنجره Permission را خود مرورگر
* مدیریت می‌کند.
*/

async function requestCamera() {

if (
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
) {

startAR();

return;

}

try {

cameraStream =
await navigator.mediaDevices.getUserMedia({

video: {

facingMode: {
ideal: "environment"
}

},

audio: false

});

/*
* دوربین باز شد.
*/

video.srcObject =
cameraStream;

video.style.display =
"block";

await video.play();

/*
* راهنما
*/

instruction.style.display =
"block";

/*
* تلاش برای شروع مستقیم AR
*/

startAR();

}

catch (error) {

console.log(
"Camera permission:",
error
);

/*
* حتی اگر Permission دوربین
* رد شود، صفحه‌ی اضافه‌ای
* از طرف ما ساخته نمی‌شود.
*/

instruction.style.display =
"block";

}

}

/*
* =========================================
* START WEBXR AR
* =========================================
*/

async function startAR() {

if (
!navigator.xr
) {

/*
* WebXR پشتیبانی نمی‌شود.
*
* در این حالت دوربین معمولی
* همچنان باز است.
*/

return;

}

try {

const supported =
await navigator.xr.isSessionSupported(
"immersive-ar"
);

if (!supported) {

return;

}

/*
* تلاش برای ورود مستقیم به AR.
*
* اگر مرورگر user activation
* بخواهد، این درخواست رد می‌شود
* و لمس راهنما دوباره آن را
* امتحان خواهد کرد.
*/

arSession =
await navigator.xr.requestSession(

"immersive-ar",

{

requiredFeatures: [
"local-floor"
 ],

optionalFeatures: [
"dom-overlay"
 ],

domOverlay: {

root: document.body

}

}

);

await renderer.xr.setSession(
arSession
);

/*
* WebXR حالا تصویر دوربین
* خودش را مدیریت می‌کند.
*/

arIsRunning =
true;

video.style.display =
"none";

renderer.domElement.style.display =
"block";

/*
* مدل هنوز مخفی است.
*/

doll.visible =
false;

instruction.style.display =
"block";

/*
* وقتی AR بسته شود
*/

arSession.addEventListener(

"end",

function () {

arIsRunning =
false;

instruction.style.display =
"none";

animationStarted =
false;

if (doll) {

doll.visible =
false;

scene.remove(
doll
);

}

}

);

}

catch (error) {

/*
* اگر مرورگر به دلیل نبودن
* user activation اجازه نداد،
* چیزی به کاربر نشان نمی‌دهیم.
*
* دوربین معمولی و راهنما
* همچنان روی صفحه هستند.
*/

console.log(
"WebXR waiting for touch:",
error
);

}

}

/*
* =========================================
* TOUCH
* =========================================
*/

document.addEventListener(

"pointerdown",

async function () {

/*
* اگر AR هنوز شروع نشده،
* همین لمس برای شروع آن استفاده شود.
*/

if (!arIsRunning) {

try {

await startAR();

}

catch (error) {

console.log(error);

}

/*
* اگر همین لمس باعث شروع AR شد،
* ادامه بده.
*/

if (!arIsRunning) {

return;

}

}

/*
* راهنما را مخفی کن.
*/

instruction.style.display =
"none";

/*
* مدل را نشان بده.
*/

showDoll();

},

{
passive: true
}

);

/*
* =========================================
* SHOW DOLL
* =========================================
*/

function showDoll() {

if (
!doll ||
!arIsRunning
) {

return;

}

/*
* جلوگیری از شروع دوباره
*/

if (
animationStarted
) {

return;

}

/*
* دوربین XR
*/

const xrCamera =
renderer.xr.getCamera(
camera
);

/*
* جهت جلوی دوربین
*/

const forward =
new THREE.Vector3(

0,
0,
-1

);

forward.applyQuaternion(

xrCamera.quaternion

);

/*
* مدل را یک متر جلوی مخاطب
* قرار می‌دهیم.
*/

doll.position.copy(

xrCamera.position

);

doll.position.add(

forward.multiplyScalar(1)

);

/*
* ارتفاع تقریباً برابر دوربین
*/

doll.position.y =
xrCamera.position.y;

/*
* مدل رو به مخاطب باشد.
*/

const lookAt =
new THREE.Vector3();

lookAt.copy(

xrCamera.position

);

lookAt.y =
doll.position.y;

doll.lookAt(
lookAt
);

/*
* اضافه کردن مدل به Scene
*/

scene.add(
doll
);

/*
* مدل الآن ظاهر شود.
*/

doll.visible =
true;

/*
* =====================================
* ANIMATION
* =====================================
*/

if (

mixer &&
animationClip

) {

animationStarted =
true;

const action =
mixer.clipAction(
animationClip
);

/*
* از ابتدا
*/

action.reset();

/*
* فقط یک بار
*/

action.setLoop(

THREE.LoopOnce,

1

);

/*
* بعد از پایان روی فریم آخر
* باقی بماند.
*/

action.clampWhenFinished =
true;

action.play();

}

}

/*
* =========================================
* RENDER LOOP
* =========================================
*/

const clock =
new THREE.Clock();

renderer.setAnimationLoop(

function () {

const delta =
clock.getDelta();

if (

mixer &&
animationStarted

) {

mixer.update(
delta
);

}

renderer.render(

scene,
camera

);

}

);

/*
* =========================================
* RESIZE
* =========================================
*/

window.addEventListener(

"resize",

function () {

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(

window.innerWidth,
window.innerHeight

);

}

);

</script>

</body>

</html>
