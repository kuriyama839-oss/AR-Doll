<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AR Doll</title>

<!-- Model Viewer -->
<script
type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>

* {
box-sizing: border-box;
}

html,
body {

width: 100%;
height: 100%;

margin: 0;
padding: 0;

overflow: hidden;

background: #000;

font-family: Arial, sans-serif;
}

model-viewer {

width: 100%;
height: 100%;

background: transparent;
}

/* =========================
AR BUTTON
========================= */

#ar-button {

position: absolute;

left: 50%;
bottom: 30px;

transform: translateX(-50%);

border: none;

border-radius: 30px;

padding: 16px 30px;

background: white;

color: #111;

font-size: 17px;

font-weight: bold;

box-shadow:
0 4px 20px rgba(0, 0, 0, 0.35);

cursor: pointer;

z-index: 10;
}

#ar-button:active {

transform:
translateX(-50%)
scale(0.96);
}

/* =========================
LOADING
========================= */

#loading {

position: fixed;

inset: 0;

display: flex;

justify-content: center;
align-items: center;

background: #000;

color: white;

font-size: 17px;

z-index: 20;
}

/* =========================
INSTRUCTION
========================= */

#instruction {

position: fixed;

left: 50%;

bottom: 100px;

transform: translateX(-50%);

display: none;

width: max-content;

max-width: calc(100% - 40px);

padding: 14px 24px;

border-radius: 30px;

background: rgba(0, 0, 0, 0.72);

color: white;

font-size: 17px;

font-weight: bold;

text-align: center;

z-index: 100;

pointer-events: none;

backdrop-filter: blur(8px);

-webkit-backdrop-filter: blur(8px);
}

/* =========================
ERROR
========================= */

#error {

position: fixed;

left: 20px;
right: 20px;

top: 50%;

transform: translateY(-50%);

display: none;

padding: 22px;

border-radius: 15px;

background: white;

color: #111;

text-align: center;

font-size: 16px;

z-index: 30;
}

</style>

</head>

<body>

<!-- Loading -->

<div id="loading">

در حال بارگذاری...

</div>

<!-- Error -->

<div id="error">

فایل سه‌بعدی قابل بارگذاری نیست.

<br><br>

مطمئن شوید فایل
<b>doll.glb</b>
در کنار
<b>index.html</b>
قرار دارد.

</div>

<!--
Instruction shown when AR starts
-->

<div id="instruction">

برای ادامه صفحه را لمس کنید

</div>

<!--
3D MODEL
-->

<model-viewer

id="doll"

src="./doll.glb"

alt="3D knitted doll"

camera-controls

ar

ar-modes="webxr scene-viewer quick-look"

ar-placement="floor"

shadow-intensity="1"

exposure="1"

interaction-prompt="auto"

/*
* Initial view:
* model faces the camera
*/

camera-orbit="0deg 75deg 105%"

/*
* Animation runs only once
*/

animation-loop="false"

>

<!-- AR BUTTON -->

<button
id="ar-button"
slot="ar-button"
>

📱 مشاهده در واقعیت افزوده

</button>

</model-viewer>

<script>

const modelViewer =
document.getElementById("doll");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const instruction =
document.getElementById("instruction");

/*
* ============================
* STATE
* ============================
*/

let modelLoaded = false;

let arStarted = false;

let animationStarted = false;

/*
* ============================
* MODEL LOADED
* ============================
*
* DO NOT start animation here.
*/

modelViewer.addEventListener(
"load",
function () {

modelLoaded = true;

loading.style.display = "none";

/*
* Stop animation immediately.
*/

modelViewer.pause();

/*
* Put animation at its
* very first frame.
*/

modelViewer.currentTime = 0;

/*
* Initial model orientation.
*
* The model starts facing
* the viewer.
*/

modelViewer.cameraOrbit =
"0deg 75deg 105%";

}
);

/*
* ============================
* MODEL ERROR
* ============================
*/

modelViewer.addEventListener(
"error",
function () {

loading.style.display = "none";

errorBox.style.display = "block";

}
);

/*
* ============================
* AR STATUS
* ============================
*/

modelViewer.addEventListener(
"ar-status",
function (event) {

const status =
event.detail.status;

console.log(
"AR status:",
status
);

/*
* ========================
* AR STARTED
* ========================
*/

if (
status === "session-started" ||
status === "presenting"
) {

arStarted = true;

animationStarted = false;

/*
* IMPORTANT:
*
* Animation remains stopped.
*/

modelViewer.pause();

/*
* Start from first frame.
*/

modelViewer.currentTime = 0;

/*
* Show instruction.
*/

instruction.style.display =
"block";

}

/*
* ========================
* AR ENDED
* ========================
*/

if (
status === "not-presenting"
) {

arStarted = false;

animationStarted = false;

/*
* Hide instruction.
*/

instruction.style.display =
"none";

/*
* Reset animation.
*/

modelViewer.pause();

modelViewer.currentTime = 0;

}

}
);

/*
* ============================
* USER TOUCH
* ============================
*
* The first touch after AR starts
* starts the animation.
*/

document.addEventListener(
"touchstart",
startAnimation,
{
passive: true
}
);

document.addEventListener(
"click",
startAnimation
);

function startAnimation() {

/*
* AR must already be active.
*/

if (!arStarted) {

return;

}

/*
* Don't start it again.
*/

if (animationStarted) {

return;

}

animationStarted = true;

/*
* Hide instruction.
*/

instruction.style.display =
"none";

/*
* Start animation
* from the beginning.
*/

modelViewer.currentTime = 0;

modelViewer.play();
modelViewer.addEventListener(
"animation-finished",
function () {
modelViewer.pause();
},
{ once: true }
);
}

</script>

</body>

</html>
