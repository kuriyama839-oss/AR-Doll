<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>My AR Doll</title>

<!-- Google Model Viewer -->
<script
type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
* {
box-sizing: border-box;
}

html,
body {
width: 100%;
height: 100%;
margin: 0;
padding: 0;
overflow: hidden;
background: #000;
}

model-viewer {
width: 100%;
height: 100%;
background: transparent;
}

/* AR button */
#ar-button {
position: absolute;
left: 50%;
bottom: 30px;
transform: translateX(-50%);

border: none;
border-radius: 30px;

padding: 15px 28px;

background: rgba(255, 255, 255, 0.95);
color: #111;

font-size: 16px;
font-family: Arial, sans-serif;
font-weight: bold;

box-shadow: 0 4px 20px rgba(0,0,0,0.3);

cursor: pointer;
z-index: 10;
}

#ar-button:active {
transform: translateX(-50%) scale(0.96);
}

/* Loading screen */
#loading {
position: fixed;
inset: 0;

display: flex;
justify-content: center;
align-items: center;

background: #000;
color: white;

font-family: Arial, sans-serif;
font-size: 16px;

z-index: 20;
}

#error {
position: fixed;
left: 20px;
right: 20px;
top: 50%;
transform: translateY(-50%);

display: none;

padding: 20px;

border-radius: 15px;

background: rgba(255,255,255,0.95);
color: #111;

text-align: center;
font-family: Arial, sans-serif;

z-index: 30;
}
</style>
</head>

<body>

<!-- Loading -->
<div id="loading">
Loading 3D model...
</div>

<!-- Error -->
<div id="error">
Unable to load the 3D model.
<br><br>
Please check your internet connection.
</div>

<!--
3D MODEL
Replace "doll.glb" with the exact filename of your GLB file.
-->
<model-viewer
id="doll"

src="./doll.glb"

camera-controls

autoplay

animation-loop="once"

ar

ar-modes="webxr scene-viewer quick-look"

ar-placement="floor"

shadow-intensity="1"

exposure="1"

interaction-prompt="auto"

camera-orbit="0deg 75deg 105%"

alt="3D knitted doll"
>

<!-- AR button -->
<button
id="ar-button"
slot="ar-button"
>
View in AR
</button>

</model-viewer>

<script>

const modelViewer = document.getElementById("doll");
const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");

/*
* When the GLB has finished loading
*/
modelViewer.addEventListener("load", () => {

loading.style.display = "none";

/*
* Start the animation contained inside the GLB.
*
* If your GLB contains only one animation,
* model-viewer will automatically use it.
*/
modelViewer.play();

});

/*
* If loading fails
*/
modelViewer.addEventListener("error", () => {

loading.style.display = "none";

errorBox.style.display = "block";

});

/*
* When AR starts
*/
modelViewer.addEventListener("ar-status", (event) => {

console.log("AR status:", event.detail.status);

});

/*
* When the user returns from AR,
* play the animation again.
*/
modelViewer.addEventListener("ar-status", (event) => {

if (event.detail.status === "not-presenting") {

modelViewer.currentTime = 0;

modelViewer.play();

}

});

</script>

</body>
</html>
