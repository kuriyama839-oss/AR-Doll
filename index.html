<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR عروسک</title>

<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<style>
body { margin: 0; overflow: hidden; font-family: Arial; }
#loading {
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
color: white;
font-size: 18px;
background: rgba(0,0,0,0.7);
padding: 20px 30px;
border-radius: 12px;
z-index: 1000;
text-align: center;
}
#status {
position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%);
background: rgba(0,0,0,0.8);
color: white;
padding: 12px 24px;
border-radius: 50px;
z-index: 999;
font-size: 16px;
text-align: center;
backdrop-filter: blur(5px);
border: 1px solid rgba(255,255,255,0.2);
}
</style>
</head>
<body>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;">

<!-- ======= نشانگر Hiro (پیش‌فرض) ======= -->
<a-marker preset="hiro">
<a-entity gltf-model="doll.glb"
animation-mixer="clip: *; loop: repeat; timeScale: 1;"
scale="0.5 0.5 0.5"
position="0 0 0">
</a-entity>
</a-marker>

<!-- ======= دوربین ======= -->
<a-entity camera></a-entity>

</a-scene>

<div id="loading">⏳ در حال بارگذاری عروسک...</div>
<div id="status">📷 نشانگر Hiro رو جلوی دوربین بگیر</div>

<script>
// وقتی مدل لود شد، پیام بارگذاری رو مخفی کن
document.querySelector('a-entity[gltf-model]').addEventListener('model-loaded', function() {
document.getElementById('loading').style.display = 'none';
});

// وقتی نشانگر پیدا شد، پیام رو عوض کن
document.querySelector('a-marker').addEventListener('markerFound', function() {
document.getElementById('status').innerHTML = '🎉 عروسک پیدا شد!';
});

document.querySelector('a-marker').addEventListener('markerLost', function() {
document.getElementById('status').innerHTML = '📷 نشانگر Hiro رو جلوی دوربین بگیر';
});
</script>
</body>
</html>
